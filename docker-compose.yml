services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: aleskei
      POSTGRES_PASSWORD: fox
      POSTGRES_DB: crm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aleskei -d crm"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: postgres://aleskei:fox@db:5432/crm
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
